<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101828" />
    <title>Exercise Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero">
        <p class="eyebrow">Local exercise log</p>
        <h1>Track today’s workout from any device on your Wi‑Fi.</h1>
        <p class="hero-copy">Start the server on your computer, open the LAN address on your phone, and your entries are saved in that phone’s browser.</p>
      </section>

      <section class="card" aria-labelledby="add-exercise-title">
        <h2 id="add-exercise-title">Add exercise</h2>
        <form id="exercise-form" class="exercise-form">
          <label>
            Exercise
            <input id="exercise-name" name="name" type="text" placeholder="Push-ups" autocomplete="off" required />
          </label>
          <div class="form-grid">
            <label>
              Sets
              <input id="exercise-sets" name="sets" type="number" min="1" step="1" value="3" required />
            </label>
            <label>
              Reps
              <input id="exercise-reps" name="reps" type="number" min="1" step="1" value="10" required />
            </label>
          </div>
          <label>
            Notes
            <textarea id="exercise-notes" name="notes" rows="3" placeholder="How did it feel?"></textarea>
          </label>
          <button type="submit">Save exercise</button>
        </form>
      </section>

      <section class="card" aria-labelledby="workout-title">
        <div class="section-heading">
          <h2 id="workout-title">Workout log</h2>
          <button id="clear-log" class="secondary" type="button">Clear</button>
        </div>
        <ul id="exercise-list" class="exercise-list"></ul>
        <p id="empty-state" class="empty-state">No exercises yet. Add your first set above.</p>
      </section>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
